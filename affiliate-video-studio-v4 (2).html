<script>
const $=id=>document.getElementById(id),W=720,H=1280,FPS=30,SR=44100;
const P={clinical:['#f4f9ff','#b9d3ec','#1d4f8a','#4c9cff'],mint:['#f2fffb','#b4e6d8','#0f5f55','#2bb6a0'],gold:['#fffaf0','#ecd7b0','#6b4a14','#d9a441']};
const ease=v=>1-Math.pow(1-Math.min(1,Math.max(0,v)),3);
let imgs=[];

// ---------- image prep: crop white margins, build floor reflection ----------
function prep(img){
  const k=Math.min(1,400/Math.max(img.width,img.height)),sw=Math.round(img.width*k),sh=Math.round(img.height*k);
  const s=document.createElement('canvas');s.width=sw;s.height=sh;const sx=s.getContext('2d');sx.drawImage(img,0,0,sw,sh);
  const d=sx.getImageData(0,0,sw,sh).data;let x0=sw,y0=sh,x1=0,y1=0;
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=(y*sw+x)*4;if(d[i]<243||d[i+1]<243||d[i+2]<243){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<=x0||y1<=y0){x0=0;y0=0;x1=sw;y1=sh}
  const m=6,a=Math.max(0,x0-m)/k,b=Math.max(0,y0-m)/k,w=Math.min(img.width-a,(x1-x0+2*m)/k),h=Math.min(img.height-b,(y1-y0+2*m)/k);
  const k2=Math.min(1,1600/w),cw=Math.round(w*k2),ch=Math.round(h*k2),c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,a,b,w,h,0,0,cw,ch);
  const r=document.createElement('canvas');r.width=cw;r.height=ch;const rx=r.getContext('2d');
  rx.translate(0,ch);rx.scale(1,-1);rx.drawImage(c,0,0);rx.setTransform(1,0,0,1,0,0);
  rx.globalCompositeOperation='destination-in';const g=rx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(.6,'rgba(0,0,0,0)');rx.fillStyle=g;rx.fillRect(0,0,cw,ch);
  return{c,r,w:cw,h:ch};
}
function wrap(x,s,maxw){const o=[];let l='';for(const k of s.split(/\s+/)){const t=l?l+' '+k:k;if(x.measureText(t).width>maxw&&l){o.push(l);l=k}else l=t}if(l)o.push(l);return o}

// ---------- the renderer: 4-beat ad (hook, reveal, macro detail, CTA) ----------
const bk=v=>{v=Math.min(1,Math.max(0,v))-1;return 1+2.7*v*v*v+1.7*v*v};
function draw(x,t,o){
  const n=o.lines.length,b=o.b;let i=0;while(i<n-1&&t>=b[i+1])i++;
  const lt=t-b[i],L=b[i+1]-b[i],p=lt/L,pal=P[o.pal],role=i==0?0:i==n-1?2:1,macro=role==1&&i==2;
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';
  const pz=1+.07*Math.pow(Math.max(0,1-lt/.25),2);
  x.translate(W/2,H/2);x.scale(pz,pz);x.translate(-W/2,-H/2);
  let g=x.createLinearGradient(0,0,W*.4,H);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);x.fillStyle=g;x.fillRect(-60,-60,W+120,H+120);
  const gx=W*(.5+.3*Math.sin(t*.7)),gy=H*.3;
  g=x.createRadialGradient(gx,gy,10,gx,gy,W);g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(-60,-60,W+120,H+120);
  for(let k=0;k<14;k++){const px=(k*173+t*(10+k*3))%(W+80)-40,py=H-((k*311+t*(14+k*2))%(H+80))+40,r=14+(k%5)*9;
    x.fillStyle='rgba(255,255,255,'+(.10+.04*(k%3))+')';x.beginPath();x.arc(px,py,r,0,6.283);x.fill()}
  const im=imgs[i%imgs.length];
  if(im){
    const mv=i%3,pulse=1+.012*Math.pow(1-((t*2)%1),2),base=W*(role==0?.86:.78)/im.w;
    let s,dx=0,rot,cy;
    if(role==0){s=base*(1.5-.5*bk(lt/.45))*pulse;cy=H*.58;rot=-.04;dx=Math.sin(lt*38)*14*Math.max(0,1-lt/.35)}
    else if(macro){s=base*2.1*pulse;cy=H*.4;rot=-.02}
    else if(role==2){s=base*(1+.06*Math.sin(t*3))*pulse;cy=H*.42;rot=-.03}
    else{s=base*(mv==0?1+.14*p:mv==1?1.08:1.14-.1*p)*pulse;dx=mv==1?(.5-p)*80:0;cy=H*.38;rot=mv==0?-.05+.03*p:mv==1?-.03:.04-.04*p}
    const iw=im.w*s,ih=im.h*s,e=role==0?1:ease(lt/.6);if(macro)dx=(.35-.7*p)*iw*.5;
    x.save();x.translate(W/2+dx,cy+(1-e)*50);x.globalAlpha=e;
    if(!macro){x.save();x.shadowColor='rgba(20,50,90,.35)';x.shadowBlur=30;x.fillStyle='rgba(20,50,90,.12)';
      x.beginPath();x.ellipse(0,ih/2+8,iw*.4,8,0,0,6.283);x.fill();x.restore()}
    x.rotate(rot);x.globalCompositeOperation='multiply';
    if(!macro)x.drawImage(im.r,-iw/2,ih/2+6,iw,ih);
    x.drawImage(im.c,-iw/2,-ih/2,iw,ih);
    x.restore();x.globalAlpha=1;x.globalCompositeOperation='source-over';
    if(role!=0&&lt<1.1){const q=ease(lt/1.1),bx=-160+(W+320)*q;g=x.createLinearGradient(bx-110,0,bx+110,0);
      g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g;x.fillRect(0,cy-ih*.7,W,ih*1.4)}
  }
  x.textAlign='left';x.textBaseline='alphabetic';
  if(role==2){
    const e=bk((lt-.2)/.4),pw=W-120,ph=120,py=H*.70,sc=e*(1+.035*Math.sin(t*8));
    x.save();x.translate(W/2,py+ph/2);x.scale(sc,sc);x.fillStyle=pal[3];x.beginPath();x.roundRect(-pw/2,-ph/2,pw,ph,60);x.fill();
    x.font='800 46px system-ui,sans-serif';const mw=x.measureText(o.lines[i]).width;
    if(mw>pw-60)x.font='800 '+Math.floor(46*(pw-60)/mw)+'px system-ui,sans-serif';
    x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(o.lines[i],0,2);x.restore();
  }else{
    const hook=role==0,ty=hook?H*.12:H*.62;x.font='800 64px system-ui,sans-serif';
    const ls=wrap(x,o.lines[i],W-130);
    if(!hook){x.fillStyle=pal[3];x.fillRect(60,ty,170*ease((lt-.15)/.6),8)}
    ls.forEach((ln,j)=>{const e=bk((lt-.1-j*.1)/.4),ea=ease((lt-.1-j*.1)/.25),yy=ty+84+j*84;
      x.save();x.globalAlpha=ea;x.translate(60,yy);x.scale(.7+.3*e,.7+.3*e);
      if(hook){const w=x.measureText(ln).width;x.fillStyle=pal[3];x.beginPath();x.roundRect(-14,-62,w+28,86,14);x.fill();x.fillStyle='#fff'}else x.fillStyle=pal[2];
      x.fillText(ln,0,0);x.restore()});
  }
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=.75;x.font='600 24px system-ui,sans-serif';x.fillStyle=pal[2];x.fillText(o.disc,60,100);x.globalAlpha=1;
  if(i>0&&lt<.14){x.fillStyle='rgba(255,255,255,'+(.55*(1-lt/.14))+')';x.fillRect(0,0,W,H)}
  const d=(t-b[n-1])/.2;if(n>1&&Math.abs(d)<1){x.fillStyle=pal[3];if(d<0)x.fillRect(0,0,W*(d+1),H);else x.fillRect(W*d,0,W*(1-d),H)}
}

// ---------- audio: optional user file + whooshes + original music bed (all synthesised) ----------
async function mixAudio(file,o){
  const oc=new OfflineAudioContext(2,Math.ceil(o.dur*SR),SR),n=o.lines.length,out=oc.createDynamicsCompressor();out.connect(oc.destination);
  if(file){const ac=new AudioContext();const buf=await ac.decodeAudioData(await file.arrayBuffer());ac.close();
    const s=oc.createBufferSource(),g=oc.createGain();s.buffer=buf;g.gain.value=.9;s.connect(g).connect(out);s.start(0);s.stop(o.dur)}
  const nb=oc.createBuffer(1,SR/2,SR),nd=nb.getChannelData(0);for(let k=0;k<nd.length;k++)nd[k]=Math.random()*2-1;
  const noise=(t0,len,type,f0,f1,vol)=>{const s=oc.createBufferSource(),f=oc.createBiquadFilter(),g=oc.createGain();s.buffer=nb;f.type=type;f.Q.value=1.2;
    f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(f1,t0+len);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+len/2);g.gain.linearRampToValueAtTime(0,t0+len);
    s.connect(f).connect(g).connect(out);s.start(t0);s.stop(t0+len)};
  const tone=(t0,fr,len,vol,type,to)=>{const s=oc.createOscillator(),g=oc.createGain();s.type=type;s.frequency.setValueAtTime(fr,t0);
    if(to)s.frequency.exponentialRampToValueAtTime(to,t0+len*.6);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+len);
    s.connect(g).connect(out);s.start(t0);s.stop(t0+len+.02)};
  for(let k=1;k<n;k++)noise(Math.max(0,o.b[k]-.2),.4,'bandpass',400,3500,.3);
  if(o.music){const bt=.5,mv=file?.45:1,roots=[110,87.31,98,82.41];
    for(let k=0,t=0;t<o.dur-.3;k++,t=k*bt){const r=roots[(k>>2)%4];
      tone(t,130,.2,.5*mv,'sine',45);noise(t+bt/2,.06,'highpass',7000,9000,.1*mv);
      if(k%2==0)tone(t,r,.4,.28*mv,'triangle');
      tone(t+bt/2,r*4*[1,1.2,1.5,1.2][k%4],.18,.07*mv,'triangle')}}
  return oc.startRendering();
}

// ---------- minimal MP4 writer (H.264 video + AAC audio) ----------
const u32=n=>[n>>>24&255,n>>>16&255,n>>>8&255,n&255],u16=n=>[n>>8&255,n&255],str=s=>[...s].map(c=>c.charCodeAt(0)),z=n=>new Array(n).fill(0);
const B=(t,...c)=>{const p=[].concat(...c.map(a=>Array.from(a)));return[...u32(p.length+8),...str(t),...p]};
const FB=(t,v,f,...c)=>B(t,[v,0,0,f],...c);
const MAT=[0x10000,0,0,0,0x10000,0,0,0,0x40000000].flatMap(u32);
function mux(V,avcC,A,asc){
  const vN=V.length,aN=A.length,ms=Math.round(vN/FPS*1000),vT=V.reduce((s,v)=>s+v.d.length,0),aT=A.reduce((s,d)=>s+d.length,0);
  const ds=[5,asc.length,...asc],dc=[4,13+ds.length,0x40,0x15,0,0,0,...u32(128000),...u32(128000),...ds],esds=FB('esds',0,0,[3,6+dc.length,0,0,0,...dc,6,1,2]);
  const vEnt=B('avc1',z(6),u16(1),z(16),u16(W),u16(H),u32(0x480000),u32(0x480000),u32(0),u16(1),z(32),u16(0x18),u16(0xffff),B('avcC',avcC));
  const aEnt=B('mp4a',z(6),u16(1),z(8),u16(2),u16(16),u32(0),u32(SR*65536),esds);
  const keys=[];V.forEach((v,i)=>{if(v.key)keys.push(i+1)});
  const trak=(id,dur,vid,mdTs,mdDur,ent,cnt,delta,sizes,off,extra)=>B('trak',
    FB('tkhd',0,3,u32(0),u32(0),u32(id),u32(0),u32(dur),z(8),u16(0),u16(0),u16(vid?0:0x100),u16(0),MAT,vid?u32(W*65536):u32(0),vid?u32(H*65536):u32(0)),
    B('mdia',FB('mdhd',0,0,u32(0),u32(0),u32(mdTs),u32(mdDur),u16(0x55c4),u16(0)),
      FB('hdlr',0,0,u32(0),str(vid?'vide':'soun'),z(12),[0]),
      B('minf',vid?FB('vmhd',0,1,z(8)):FB('smhd',0,0,z(4)),B('dinf',FB('dref',0,0,u32(1),FB('url ',0,1))),
        B('stbl',FB('stsd',0,0,u32(1),ent),FB('stts',0,0,u32(1),u32(cnt),u32(delta)),FB('stsc',0,0,u32(1),u32(1),u32(cnt),u32(1)),
          FB('stsz',0,0,u32(0),u32(cnt),sizes.flatMap(u32)),FB('stco',0,0,u32(1),u32(off)),extra||[]))));
  const moov=(vo,ao)=>B('moov',FB('mvhd',0,0,u32(0),u32(0),u32(1000),u32(ms),u32(0x10000),u16(0x100),z(10),MAT,z(24),u32(3)),
    trak(1,ms,true,FPS,vN,vEnt,vN,1,V.map(v=>v.d.length),vo,FB('stss',0,0,u32(keys.length),keys.flatMap(u32))),
    trak(2,ms,false,SR,aN*1024,aEnt,aN,1024,A.map(a=>a.length),ao));
  const ftyp=B('ftyp',str('isom'),u32(512),str('isomiso2avc1mp41'));
  const ml=moov(0,0).length,vo=ftyp.length+ml+8,ao=vo+vT,mo=moov(vo,ao);
  return new Blob([new Uint8Array(ftyp),new Uint8Array(mo),new Uint8Array([...u32(vT+aT+8),...str('mdat')]),...V.map(v=>v.d),...A],{type:'video/mp4'});
}

// ---------- self-test of the exported file ----------
async function selfTest(url,dur){
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
  await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(new Error('browser could not open the MP4'));v.src=url});
  const r=[['File opens as video',true],['Size '+v.videoWidth+'x'+v.videoHeight,v.videoWidth==W&&v.videoHeight==H],['Duration '+v.duration.toFixed(2)+'s',Math.abs(v.duration-dur)<.4]];
  const wait=ms=>new Promise(res=>setTimeout(res,ms));
  const c=document.createElement('canvas');c.width=90;c.height=160;const x=c.getContext('2d');let seen=false;
  for(const f of [.25,.5,.75]){
    v.currentTime=dur*f;await Promise.race([new Promise(res=>v.onseeked=res),wait(1500)]);
    try{await v.play();await wait(400);v.pause()}catch(e){}
    x.drawImage(v,0,0,90,160);const d=x.getImageData(0,0,90,160).data;let mn=255,mx=0;
    for(let k=0;k<d.length;k+=4){mn=Math.min(mn,d[k]);mx=Math.max(mx,d[k])}
    if(mx-mn>40){seen=true;break}
  }
  r.push(seen?['Preview frame shows a picture',true]:['No preview frame could be read in this browser. Press play and watch the video to confirm.',null]);
  return r;
}

// ---------- main ----------
window.onerror=(m)=>{$('st').textContent='Error: '+m};
const slots=[null,null,null],srcs=[null,null,null];
document.querySelectorAll('.ph').forEach((inp,k)=>inp.onchange=()=>{
  const f=inp.files&&inp.files[0];if(!f)return;
  $('st').textContent='Loading '+f.name+'...';
  const r=new FileReader();
  r.onerror=()=>{$('st').textContent='Error: could not read that file.'};
  r.onload=()=>{const im=new Image();
    im.onerror=()=>{$('st').textContent='Error: that file is not a readable image.'};
    im.onload=()=>{try{slots[k]=prep(im);srcs[k]=r.result;imgs=slots.filter(Boolean);
      $('thumbs').innerHTML=srcs.filter(Boolean).map(u=>'<img src="'+u+'" style="height:70px;border-radius:8px">').join('');
      $('st').textContent=imgs.length+' photo(s) ready.'}catch(e){$('st').textContent='Error: '+e.message}};
    im.src=r.result};
  r.readAsDataURL(f)});
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getLines=()=>$('lines').value.split('\n').map(t=>t.trim()).filter(Boolean).slice(0,6);
const bounds=(n,d)=>{const b=[0];for(let k=1;k<n;k++)b.push(Math.round(k*d/n*2)/2);b.push(d);return b};
function tele(){const c=getLines(),v=$('vo').value.split('\n').map(t=>t.trim()).filter(Boolean),b=bounds(c.length,+$('dur').value);
  $('tp').innerHTML=c.map((_,k)=>'<b>'+b[k]+'-'+b[k+1]+'s</b> '+esc(v[k]||c[k])).join('<br>')}
['lines','vo'].forEach(id=>$(id).addEventListener('input',tele));$('dur').addEventListener('change',tele);tele();
$('mkp').onclick=()=>{const n=Math.max(2,getLines().length||4),d=+$('dur').value,lang=$('pg').value,f=$('pf').value.split('\n').map(t=>t.trim()).filter(Boolean).map(t=>'- '+t).join('\n')||'- (none given: describe only what is visible, make no benefit claims)';
  const txt='You are a Malaysian TikTok and Shopee affiliate copywriter. Write a '+d+'-second vertical video script.\nProduct: '+($('pn').value||'(see photos)')+'\nVerified facts (use ONLY these, add nothing):\n'+f+'\nDo NOT claim: '+$('pa').value+'\nLanguage: '+lang+'\nStructure: '+n+' scenes. Scene 1 is a hook (max 6 words on screen). Next scenes: product reveal, then detail using only the verified facts. The last scene is a call to action to tap the product link.\nRules: truthful, no guaranteed results, no invented prices, discounts or testimonials, no medical claims unless listed in the verified facts.\nOutput ONLY this JSON and nothing else: {"captions":[exactly '+n+' short on-screen lines, max 7 words each],"voiceover":[exactly '+n+' spoken lines, natural spoken style, about '+Math.round(d/n*2.2)+' words each]}';
  const done=()=>{$('hm').textContent='Prompt copied. Paste it into a free chat AI, then paste its answer in box 2.'};
  const fb=()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();ok?done():($('pr').value=txt,$('hm').textContent='Could not copy automatically. The prompt is in box 2: select all, copy, then clear the box.')};
  if(navigator.clipboard&&navigator.clipboard.writeText){const to=setTimeout(fb,1200);navigator.clipboard.writeText(txt).then(()=>{clearTimeout(to);done()},()=>{clearTimeout(to);fb()})}else fb()};
$('ap').onclick=()=>{const t=$('pr').value,m=t.match(/\{[\s\S]*\}/);let j=null;try{j=JSON.parse(m?m[0]:t)}catch(e){}
  if(j&&Array.isArray(j.captions)&&j.captions.length){$('lines').value=j.captions.slice(0,6).map(String).join('\n');
    if(Array.isArray(j.voiceover))$('vo').value=j.voiceover.slice(0,6).map(String).join('\n');
    tele();$('hm').textContent='Applied '+Math.min(6,j.captions.length)+' scenes. Check every line against your verified facts.'}
  else $('hm').textContent='Could not read that. Ask the AI to output only the JSON.'};
let recBlob=null,mr=null;
$('rec').onclick=async()=>{
  if(mr&&mr.state=='recording'){mr.stop();return}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}),ch=[],d=+$('dur').value,t0=Date.now();let tm;
    mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    mr.onstop=()=>{clearInterval(tm);stream.getTracks().forEach(k=>k.stop());recBlob=new Blob(ch,{type:mr.mimeType});
      $('ra').src=URL.createObjectURL(recBlob);$('ra').classList.remove('hide');$('rec').textContent='Record again';
      $('rs').textContent='Saved ('+((Date.now()-t0)/1000).toFixed(1)+'s). This recording is used in the next render.'};
    mr.start();$('rec').textContent='Stop recording';
    tm=setInterval(()=>{const q=(Date.now()-t0)/1000;$('rs').textContent='Recording '+q.toFixed(0)+'s of '+d+'s. Start speaking now and follow the lines above.';if(q>=d&&mr.state=='recording')mr.stop()},250);
  }catch(e){$('rs').textContent='Error: microphone unavailable ('+e.message+'). In Android settings allow the microphone for Opera.'}};
$('go').onclick=async()=>{
  const st=t=>$('st').textContent=t,bar=p=>$('bar').firstElementChild.style.width=(p*100)+'%';
  try{
    if(!window.VideoEncoder||!window.AudioEncoder)throw new Error('This browser has no WebCodecs support.');
    if(!imgs.length)throw new Error('Add at least one product photo first.');
    const lines=$('lines').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6);
    if(lines.length<2)throw new Error('Write at least 2 caption lines.');
    const o={lines,dur:+$('dur').value,pal:$('pal').value,disc:$('disc').value.trim(),music:$('mus').value=='1'};
    o.b=[0];for(let k=1;k<lines.length;k++)o.b.push(Math.round(k*o.dur/lines.length*2)/2);o.b.push(o.dur);
    $('go').disabled=true;$('pl').classList.add('hide');$('dl').classList.add('hide');$('rep').classList.add('hide');
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
    let err=null,avcC=null,asc=null;const V=[],A=[];
    const ve=new VideoEncoder({output:(c,m)=>{const d=new Uint8Array(c.byteLength);c.copyTo(d);V.push({d,key:c.type==='key'});if(m&&m.decoderConfig&&m.decoderConfig.description)avcC=new Uint8Array(m.decoderConfig.description)},error:e=>{err=e}});
    ve.configure({codec:'avc1.42001f',width:W,height:H,bitrate:5e6,framerate:FPS,avc:{format:'avc'}});
    const N=o.dur*FPS;
    for(let f=0;f<N;f++){
      draw(x,f/FPS,o);const fr=new VideoFrame(cv,{timestamp:Math.round(f*1e6/FPS)});ve.encode(fr,{keyFrame:f%FPS==0});fr.close();
      if(err)throw err;
      if(ve.encodeQueueSize>8||f%6==0){bar(f/N*.85);st('Rendering video '+Math.round(f/N*100)+'%');await new Promise(r=>setTimeout(r,2))}
    }
    await ve.flush();ve.close();if(err)throw err;
    st('Mixing audio...');bar(.88);
    const buf=await mixAudio(recBlob||$('aud').files[0],o);
    const ae=new AudioEncoder({output:(c,m)=>{const d=new Uint8Array(c.byteLength);c.copyTo(d);A.push(d);if(m&&m.decoderConfig&&m.decoderConfig.description)asc=new Uint8Array(m.decoderConfig.description)},error:e=>{err=e}});
    ae.configure({codec:'mp4a.40.2',sampleRate:SR,numberOfChannels:2,bitrate:128000});
    const c0=buf.getChannelData(0),c1=buf.getChannelData(1);
    for(let s=0;s<buf.length;s+=4096){const m=Math.min(4096,buf.length-s),pl=new Float32Array(m*2);pl.set(c0.subarray(s,s+m),0);pl.set(c1.subarray(s,s+m),m);
      const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:m,numberOfChannels:2,timestamp:Math.round(s/SR*1e6),data:pl});ae.encode(ad);ad.close()}
    await ae.flush();ae.close();if(err)throw err;
    if(!avcC||!asc)throw new Error('Encoder did not return codec settings.');
    st('Building MP4...');bar(.95);
    const blob=mux(V,avcC,A,asc),url=URL.createObjectURL(blob);
    $('pl').src=url;$('pl').classList.remove('hide');$('dl').href=url;$('dl').classList.remove('hide');
    st('Self-test...');
    let rep;try{rep=await Promise.race([selfTest(url,o.dur),new Promise((_,j)=>setTimeout(()=>j(new Error('timed out (play the video manually to check it)')),15000))])}catch(e){rep=[['Self-test: '+e.message,false]]}
    rep.push(['Sound: press play and listen (cannot be checked automatically)',null]);
    $('rep').textContent=rep.map(r=>(r[1]===true?'PASS ':r[1]===false?'FAIL ':'CHECK ')+r[0]).join('\n');$('rep').classList.remove('hide');
    bar(1);st('Done. Size '+(blob.size/1048576).toFixed(1)+' MB.');
  }catch(e){st('Error: '+(e.message||e))}
  $('go').disabled=false;
};
</script></body></html>
